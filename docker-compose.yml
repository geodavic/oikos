services:
  duckboard:
    image: duckboard:latest
    build: .                          # this fork is not published to a registry; build locally with --build
    container_name: duckboard
    restart: unless-stopped
    ports:
      # Host and container both use PORT from .env (default 3000). The app binds
      # PORT inside the container, so both sides must match.
      - "0.0.0.0:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
      # Drop Duck Board modules into ./modules, or set MODULES_DIR=/path/to/modules.
      - ${MODULES_DIR:-./modules}:/app/modules
      # Optional local documents folder. BOTH ends come from the .env: the app
      # writes to DOCUMENT_STORAGE_LOCAL_PATH, so mounting at a fixed /documents
      # would send uploads into the container layer as soon as anyone changes
      # that path - and they would be gone on the next pull && up -d.
      - ${DOCUMENT_STORAGE_LOCAL_DIR:-./documents}:${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}
    # Bewusst die Kurzform, nicht `path:`/`required:` (Issue #765): die Langform
    # gibt es erst ab Compose v2.24, und Synology DSM, QNAP und ältere Distros
    # liefern älter - dort scheitert schon das Einlesen mit
    # "services.duckboard.env_file.0 must be a string", also noch vor dem ersten
    # Start. Die Langform stand hier für Git-/GitOps-Stacks ohne .env (#698);
    # dieser Weg geht seitdem über docs/docker-compose.portainer.yml, das jede
    # Variable einzeln aufführt. Sie hier zu behalten kaufte nichts: ohne .env
    # fehlt SESSION_SECRET, und der Container beendet sich beim Start - der
    # Deploy scheitert also so oder so, nur eine Stufe später.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=${DB_PATH:-/data/duckboard.db}
      - BACKUP_DIR=/backups
      # Local document storage (optional): set to true to store uploaded documents on the mounted /documents folder.
      - DOCUMENT_STORAGE_LOCAL_ENABLED=${DOCUMENT_STORAGE_LOCAL_ENABLED:-false}
      - DOCUMENT_STORAGE_LOCAL_PATH=${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}
      # Secure cookies come from .env (the installer sets them):
      #   - Reverse proxy + HTTPS → SESSION_SECURE=true, TRUST_PROXY=1
      #   - Direct HTTP access     → SESSION_SECURE=false, TRUST_PROXY=loopback
      # Default when unset (e.g. a .env that does not carry the line): false,
      # so direct HTTP login keeps working out of the box.
      - SESSION_SECURE=${SESSION_SECURE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
